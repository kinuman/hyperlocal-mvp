<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperLocal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #EBF4FF 0%, #F3E8FF 50%, #FCE7F3 100%); min-height: 100vh; padding: 1rem; }
        .container { max-width: 28rem; margin: 0 auto; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 1.5rem; margin-bottom: 1rem; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 1.5rem; font-weight: bold; background: linear-gradient(135deg, #2563eb, #9333ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .location { font-size: 0.875rem; color: #6b7280; }
        .center { text-align: center; }
        .icon-circle { width: 5rem; height: 5rem; margin: 0 auto; background: linear-gradient(135deg, #3b82f6, #a855f7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        h2 { font-size: 1.25rem; font-weight: bold; color: #1f2937; margin: 1rem 0; }
        p { font-size: 0.875rem; color: #6b7280; }
        .btn { width: 100%; padding: 1rem; background: linear-gradient(135deg, #3b82f6, #a855f7); color: white; border: none; border-radius: 0.75rem; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4); transition: all 0.3s; }
        .btn:hover { box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6); transform: translateY(-2px); }
        .btn-green { background: linear-gradient(135deg, #10b981, #3b82f6); }
        .btn-gray { background: #e5e7eb; color: #374151; }
        .input-box { background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 0.5rem; padding: 1rem; margin: 1rem 0; }
        .user-card { border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 1rem; margin: 0.75rem 0; cursor: pointer; transition: all 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .user-card:hover { border-color: #a855f7; background: #faf5ff; }
        .user-avatar { width: 2.5rem; height: 2.5rem; background: linear-gradient(135deg, #60a5fa, #a78bfa); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.25rem; }
        .user-info { display: flex; align-items: center; gap: 0.75rem; }
        .user-details { font-size: 0.75rem; color: #6b7280; margin-top: 0.25rem; }
        .select-btn { color: #a855f7; font-weight: 600; }
        .summary { background: #f9fafb; border-radius: 0.75rem; padding: 1rem; margin: 1.5rem 0; }
        .summary-row { display: flex; justify-content: space-between; margin: 0.5rem 0; font-size: 0.875rem; }
        .summary-total { border-top: 1px solid #e5e7eb; padding-top: 0.75rem; margin-top: 0.75rem; font-weight: bold; }
        .tech-stack { background: #ECFDF5; border-radius: 0.75rem; padding: 1rem; margin: 1.5rem 0; }
        .tech-stack p { color: #065F46; font-weight: 600; }
        .tech-stack ul { margin-top: 0.5rem; }
        .tech-stack li { color: #047857; font-size: 0.75rem; margin: 0.25rem 0; list-style: none; }
        .footer { text-align: center; font-size: 0.75rem; color: #6b7280; margin-top: 1.5rem; }
        .space-y { margin: 1rem 0; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .bounce { animation: bounce 1s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [step, setStep] = useState('input');
            const [request, setRequest] = useState(null);
            const [nearbyUsers, setNearbyUsers] = useState([]);
            const [selectedHelper, setSelectedHelper] = useState(null);
            const [voiceInput, setVoiceInput] = useState('');

            const mockNearbyUsers = [
                { id: 1, name: 'Taro Y.', distance: 120, rating: 4.8, response: '2分' },
                { id: 2, name: 'Hanako S.', distance: 250, rating: 4.9, response: '3分' },
                { id: 3, name: 'Ken T.', distance: 380, rating: 4.7, response: '5分' }
            ];

            const handleVoiceInput = () => {
                const mockInput = "今からローソンでコーヒー1つ買ってきてほしい、300円払います";
                setVoiceInput(mockInput);
                
                setTimeout(() => {
                    setRequest({
                        task: 'コーヒーの購入代行',
                        location: 'ローソン 渋谷3丁目店',
                        reward: 300,
                        duration: 15
                    });
                    setStep('matching');
                    setNearbyUsers(mockNearbyUsers);
                }, 1500);
            };

            return (
                <div className="container">
                    <div className="card">
                        <div className="header">
                            <div className="title">HyperLocal</div>
                            <div className="location">📍 渋谷駅周辺</div>
                        </div>
                    </div>

                    {step === 'input' && (
                        <div className="card">
                            <div className="center">
                                <div className="icon-circle">🎤</div>
                                <h2>何をお願いしますか?</h2>
                                <p>音声で簡単にリクエストできます</p>
                            </div>
                            {voiceInput && (
                                <div className="input-box">
                                    <p>"{voiceInput}"</p>
                                    <p style={{marginTop: '0.5rem', fontSize: '0.75rem', color: '#3b82f6'}}>⚡ AI解析中...</p>
                                </div>
                            )}
                            <button onClick={handleVoiceInput} className="btn" style={{marginTop: '1rem'}}>🎤 音声で依頼する</button>
                            <p style={{textAlign: 'center', marginTop: '1rem', fontSize: '0.75rem'}}>例: 「今からコンビニでコーヒー買ってきて、300円払います」</p>
                        </div>
                    )}

                    {step === 'matching' && (
                        <>
                            <div className="card">
                                <h3 style={{fontWeight: 'bold'}}>💰 {request.task}</h3>
                                <p>{request.location}</p>
                                <p style={{fontSize: '0.75rem', marginTop: '0.5rem'}}>💵 {request.reward} JPYC | ⏱️ {request.duration}分間有効</p>
                            </div>
                            <div className="card">
                                <h3 style={{fontWeight: 'bold', marginBottom: '1rem'}}>近くのヘルパー (500m以内)</h3>
                                {nearbyUsers.map(user => (
                                    <div key={user.id} className="user-card" onClick={() => { setSelectedHelper(user); setStep('payment'); }}>
                                        <div className="user-info">
                                            <div className="user-avatar">👤</div>
                                            <div>
                                                <div style={{fontWeight: '600'}}>{user.name}</div>
                                                <div className="user-details">⭐ {user.rating} | 📍 {user.distance}m | ⏱️ {user.response}</div>
                                            </div>
                                        </div>
                                        <div className="select-btn">選択</div>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}

                    {step === 'payment' && (
                        <div className="card">
                            <div className="center">
                                <div className="icon-circle" style={{background: 'linear-gradient(135deg, #10b981, #3b82f6)', width: '4rem', height: '4rem', fontSize: '1.5rem'}}>✓</div>
                                <h2>マッチング成立!</h2>
                                <p>{selectedHelper?.name}さんが対応します</p>
                            </div>
                            <div className="summary">
                                <div className="summary-row"><span>依頼内容</span><span>{request.task}</span></div>
                                <div className="summary-row"><span>報酬</span><span>{request.reward} JPYC</span></div>
                                <div className="summary-row"><span>手数料</span><span>30 JPYC (10%)</span></div>
                                <div className="summary-row summary-total"><span>合計</span><span style={{color: '#a855f7', fontSize: '1.125rem'}}>{request.reward + 30} JPYC</span></div>
                            </div>
                            <button onClick={() => setStep('complete')} className="btn btn-green">💳 JPYC で支払う</button>
                            <p style={{textAlign: 'center', marginTop: '0.75rem', fontSize: '0.75rem'}}>スマートコントラクトでエスクロー保護</p>
                        </div>
                    )}

                    {step === 'complete' && (
                        <div className="card">
                            <div className="center">
                                <div className="icon-circle bounce" style={{background: 'linear-gradient(135deg, #10b981, #3b82f6)'}}>✓</div>
                                <h2 style={{fontSize: '1.5rem'}}>取引完了!</h2>
                                <p>{selectedHelper?.name}さんへの支払いが完了しました</p>
                            </div>
                            <div className="tech-stack">
                                <p>✨ 実装済みの技術スタック</p>
                                <ul>
                                    <li>• OpenAI Structured Outputs (音声→JSON)</li>
                                    <li>• PostGIS空間インデックス (500m圏内検索)</li>
                                    <li>• JPYC × Polygon (エスクロー自動決済)</li>
                                    <li>• リアルタイムプッシュ通知 (Supabase)</li>
                                </ul>
                            </div>
                            <button onClick={() => { setStep('input'); setRequest(null); setSelectedHelper(null); setVoiceInput(''); }} className="btn btn-gray">新しい依頼を作成</button>
                        </div>
                    )}

                    <div className="footer">🚀 ハッカソンデモ版 | 次のフェーズ: 会場内検証 → 大学キャンパス展開</div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
